workflows:
  android-release:
    name: Android Release APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.tap.kxmpzq"
        STORE_PASSWORD: "android"
        KEY_PASSWORD: "android"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Prepare Signing Keystore
        script: |
          if [ ! -s "$CM_BUILD_DIR/debug.keystore" ]; then
            if [ -f "$CM_BUILD_DIR/debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              python3 -c 'import base64, sys; open(sys.argv[2], "wb").write(base64.b64decode(open(sys.argv[1]).read()))' \
                "$CM_BUILD_DIR/debug.keystore.base64" "$CM_BUILD_DIR/debug.keystore" || \
              base64 -D -i "$CM_BUILD_DIR/debug.keystore.base64" -o "$CM_BUILD_DIR/debug.keystore" || \
              base64 -d "$CM_BUILD_DIR/debug.keystore.base64" > "$CM_BUILD_DIR/debug.keystore"
            fi
            if [ ! -s "$CM_BUILD_DIR/debug.keystore" ]; then
              echo "Generating fallback debug.keystore..."
              rm -f "$CM_BUILD_DIR/debug.keystore"
              keytool -genkeypair -v -keystore "$CM_BUILD_DIR/debug.keystore" \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ -z "$KEYSTORE_PATH" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating release signing keystore..."
            keytool -genkeypair -v -keystore "$CM_BUILD_DIR/my-upload-key.jks" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -dname "CN=TAP, OU=AIStudio, O=TAP, L=London, ST=London, C=GB"
            export KEYSTORE_PATH="$CM_BUILD_DIR/my-upload-key.jks"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $CM_ENV
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $CM_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $CM_ENV
      - name: Build Android Release APK and Bundle
        script: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          fi
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug bundleRelease
      - name: Verify Signed APK Artifacts
        script: |
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/apk/debug/ || true
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - terseeenoch7@gmail.com
        notify:
          success: true
          failure: true
